<!DOCTYPE html>
<html lang="es">
<head>
  <!-- =====================================
     CONFIGURACIÓN GENERAL DEL DOCUMENTO
  ====================================== -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banco Digital | Sistema de Gestión Bancaria</title>

  <!-- HOJA DE ESTILOS -->
  <link rel="stylesheet" href="./css/styles.css">
</head>

<body class="auth-page">
  <!-- =====================================
     ENCABEZADO PRINCIPAL
  ====================================== -->
  <header class="auth-header">
    <h1>Banco Digital</h1>
    <p>Sistema de Gestión Bancaria</p>
    <span>Proyecto Integrador — Módulo 4</span>
  </header>

  <!-- =====================================
     CONTENEDOR DE AUTENTICACIÓN
  ====================================== -->
  <main class="auth-container">
    <!-- =====================================
       FORMULARIO DE INICIO DE SESIÓN
    ====================================== -->
    <section class="auth-card">
      <h2>Iniciar sesión</h2>
      <form id="formLogin" novalidate>
        <div class="form-group">
          <label for="loginEmail">Correo electrónico</label>
          <input
            id="loginEmail"
            type="email"
            placeholder="correo@ejemplo.com"
          >
        </div>

        <div class="form-group">
          <label for="loginPassword">Contraseña</label>
          <input
            id="loginPassword"
            type="password"
            placeholder="Tu contraseña"
          >
        </div>

        <button type="submit" class="btn btn-primary">
          Iniciar sesión
        </button>
      </form>
    </section>

    <!-- =====================================
       FORMULARIO DE REGISTRO DE USUARIO
    ====================================== -->
    <section class="auth-card">
      <h2>Crear cuenta</h2>
      <form id="formRegistro" novalidate>
        <div class="form-group">
          <label for="registroNombre">Nombre completo</label>
          <input
            id="registroNombre"
            type="text"
            placeholder="Juan Suarez"
          >
        </div>

        <div class="form-group">
          <label for="registroEmail">Correo electrónico</label>
          <input
            id="registroEmail"
            type="email"
            placeholder="correo@ejemplo.com"
          >
        </div>

        <div class="form-group">
          <label for="registroTelefono">Teléfono</label>
          <input
            id="registroTelefono"
            type="tel"
            placeholder="5512345678"
          >
        </div>

        <div class="form-group">
          <label for="registroPassword">Contraseña</label>
          <input
            id="registroPassword"
            type="password"
            placeholder="Mínimo 6 caracteres"
          >
        </div>

        <!-- Confirmar contraseña para sincronizar con main.js -->
        <div class="form-group">
          <label for="registroConfirmPassword">Confirmar contraseña</label>
          <input
            id="registroConfirmPassword"
            type="password"
            placeholder="Repite tu contraseña"
          >
        </div>

        <button type="submit" class="btn btn-primary">
          Registrarme
        </button>
      </form>
    </section>
  </main>

  <!-- =====================================
     LIBRERÍAS Y MÓDULOS DE JAVASCRIPT
  ====================================== -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
